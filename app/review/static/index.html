<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>custIDR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/static/app.css">
  <script src="/app/static/theme-init.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 26'%3E%3Ccircle cx='13' cy='13' r='10' fill='none' stroke='%233346C9' stroke-width='3'/%3E%3Ccircle cx='27' cy='13' r='10' fill='none' stroke='%233346C9' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="bar" id="bar" hidden>
    <a class="brand" href="#/" aria-label="custIDR home">
      <svg class="brand-mark" viewBox="0 0 40 26" aria-hidden="true"><circle cx="13" cy="13" r="10"/><circle cx="27" cy="13" r="10"/></svg>
      <span class="brand-name">cust<b>IDR</b></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/lookup" data-nav="lookup" id="nav-lookup" hidden>Lookup</a>
      <a href="#/queue" data-nav="queue">Review queue <span class="badge" id="queue-badge" hidden></span></a>
      <a href="#/history" data-nav="history">History</a>
    </nav>
    <form class="quick" id="quick" role="search" hidden>
      <label class="sr-only" for="quick-q">Search customers</label>
      <input id="quick-q" type="search" placeholder="Email, phone, postcode or ID" autocomplete="off" maxlength="200">
    </form>
    <div class="who">
      <span class="avatar" id="who-initials" aria-hidden="true"></span>
      <span class="who-text"><span id="who-name"></span><span class="who-role" id="who-role"></span></span>
      <span id="theme-slot"></span>
      <button type="button" class="link link-light" id="signout">Sign out</button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app/static/js/main.js"></script>
</body>
</html>
