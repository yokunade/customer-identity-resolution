[project]
name = "customer-identity-resolution"
version = "0.2.0"
description = "UK customer data cleansing and deterministic identity resolution service"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Bugs and modern idiom. Layout is left to the house style (compact data tables),
# so there is no formatter and no line-length rule.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # pytest fixtures re-exported from another test module
