# Local demo: PostgreSQL, the API with its review app, and a one-off job that
# loads synthetic customers through the real matching pipeline.
#
#   docker compose up --build
#   open http://localhost:8000/review
#
# Every setting has a demo default; override any of them in a .env file.
# The defaults are for a laptop demo only, not for production.

name: identity-resolution

x-app-env: &app-env
  DATABASE_URL: postgresql://identity:identity@db:5432/identity
  KEY_SECRET: ${KEY_SECRET:-demo-only-key-secret-change-me}
  API_KEYS: ${API_KEYS:-demo-key}
  # Name + address matches without DOB or a personal identifier go to review,
  # so the demo queue has cases in it.
  AUTO_LINK_TIERS: ${AUTO_LINK_TIERS:-exact,strong,probable}
  # The demo is served over plain http; set true behind HTTPS.
  REVIEW_COOKIE_SECURE: ${REVIEW_COOKIE_SECURE:-false}
  # After each decision, show the known answer for synthetic demo cases.
  DEMO_MODE: ${DEMO_MODE:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_PORT: ${API_PORT:-8000}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    image: identity-resolution:local
    environment: *app-env
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  seed:
    build: .
    image: identity-resolution:local
    command: ["python", "-m", "benchmark.seed_demo"]
    environment:
      <<: *app-env
      DEMO_RECORDS: ${DEMO_RECORDS:-20000}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-review-demo-2026}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: "no"

  # ---- scale benchmark (docs/BENCHMARK.md): only started with --profile bench.
  # Its own PostgreSQL, tuned for a ~30 GB machine, so the demo database is untouched.
  bench-db:
    profiles: ["bench"]
    image: postgres:16
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity_bench
    command:
      - postgres
      - -c
      - shared_buffers=${BENCH_SHARED_BUFFERS:-6GB}
      - -c
      - effective_cache_size=${BENCH_EFFECTIVE_CACHE:-16GB}
      - -c
      - maintenance_work_mem=1GB
      - -c
      - work_mem=16MB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=60
    shm_size: 1g
    ports: ["127.0.0.1:${BENCH_DB_PORT:-5434}:5432"]
    volumes: [benchpg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity_bench"]
      interval: 2s
      timeout: 3s
      retries: 30

  bench:
    profiles: ["bench"]
    build: .
    image: identity-resolution:local
    user: root  # writes to the named data volume
    entrypoint: ["python", "-m", "benchmark.scale", "--db", "postgresql://identity:identity@bench-db:5432/identity_bench",
                 "--dir", "/data", "--report-dir", "/reports"]
    command: []
    volumes:
      - benchfiles:/data
      - ./benchmark/results/scale:/reports
    depends_on:
      bench-db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  benchpg:
  benchfiles:
